<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تأمين حساب المعلم - ROOT ACCESS LMS</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #050505; color: #f3f4f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #0d1117; padding: 35px; border-radius: 12px; width: 100%; max-width: 420px; box-shadow: 0 0 30px rgba(0, 255, 136, 0.12); border: 1px solid #00ff88; }
        h2 { color: #00ff88; text-align: center; margin-top: 0; text-shadow: 0 0 8px rgba(0, 255, 136, 0.3); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #374151; background: #050505; color: white; box-sizing: border-box; outline: none; }
        input:focus { border-color: #00ff88; }
        button { width: 100%; padding: 12px; background: #00ff88; color: #050505; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background: #00cc6a; }
        #msg { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 تعيين كلمة مرور المعلم</h2>
        <p style="text-align:center; font-size:14px; color:#9ca3af;">أنشئ كلمة مرور قوية لحماية حسابك في ROOT ACCESS</p>
        <form id="activateForm">
            <input type="password" id="new_password" placeholder="أدخل كلمة المرور الجديدة" required minlength="6">
            <input type="password" id="confirm_password" placeholder="تأكيد كلمة المرور" required minlength="6">
            <button type="submit">حفظ وتفعيل الحساب</button>
        </form>
        <div id="msg"></div>
    </div>

    <script>
        document.getElementById("activateForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const pw1 = document.getElementById("new_password").value;
            const pw2 = document.getElementById("confirm_password").value;
            const msgDiv = document.getElementById("msg");

            if (pw1 !== pw2) {
                msgDiv.style.color = "#ef4444";
                msgDiv.innerText = "كلمات المرور غير متطابقة!";
                return;
            }

            const token = new URLSearchParams(window.location.search).get("token");
            if (!token) {
                msgDiv.style.color = "#ef4444";
                msgDiv.innerText = "رمز الأمان مفقود من الرابط!";
                return;
            }

            const formData = new FormData();
            formData.append("token", token);
            formData.append("new_password", pw1);

            const response = await fetch("/api/teacher/activate-account", { method: "POST", body: formData });
            const result = await response.json();

            if (response.ok) {
                msgDiv.style.color = "#00ff88";
                msgDiv.innerText = result.message + " - جاري التوجيه للبوابة...";
                setTimeout(() => window.location.href = "/portal", 2000);
            } else {
                msgDiv.style.color = "#ef4444";
                msgDiv.innerText = result.detail || "رابط التفعيل غير صالح";
            }
        });
    </script>
</body>
</html>
