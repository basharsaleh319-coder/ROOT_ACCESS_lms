<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الدخول - ROOT ACCESS LMS</title>
    <style>
        :root {
            --bg-black: #050505; --card-dark: #0d1117; --border-dark: #1f2937;
            --neon-green: #00ff88; --neon-dim: rgba(0, 255, 136, 0.12);
            --danger: #ef4444; --text-main: #f3f4f6; --text-muted: #9ca3af;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-black); color: var(--text-main); margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        
        header {
            background: var(--card-dark); padding: 15px 30px; border-bottom: 1px solid var(--neon-green);
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand { font-size: 20px; font-weight: bold; color: var(--neon-green); letter-spacing: 1.5px; text-shadow: 0 0 8px rgba(0, 255, 136, 0.4); }
        
        .wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .portal-card {
            background: var(--card-dark); border: 1px solid var(--neon-green); border-radius: 14px;
            width: 100%; max-width: 440px; padding: 30px; box-shadow: 0 0 35px rgba(0, 255, 136, 0.12);
        }

        .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .tab-btn {
            padding: 12px; background: var(--bg-black); color: var(--text-muted);
            border: 1px solid var(--border-dark); border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .tab-btn.active { background: var(--neon-green); color: #050505; border-color: var(--neon-green); }

        .form-box { display: none; }
        .form-box.active { display: block; }

        label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
        input {
            width: 100%; padding: 12px; margin-bottom: 16px; background: var(--bg-black);
            border: 1px solid #374151; border-radius: 8px; color: white; font-size: 15px; outline: none;
        }
        input:focus { border-color: var(--neon-green); box-shadow: 0 0 8px rgba(0, 255, 136, 0.2); }

        .btn-neon {
            width: 100%; padding: 13px; background: var(--neon-green); color: #050505;
            border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s;
        }
        .btn-neon:hover { background: #00cc6a; box-shadow: 0 0 15px rgba(0, 255, 136, 0.4); }

        .err-msg {
            background: rgba(239, 68, 68, 0.15); border: 1px solid var(--danger);
            color: #f87171; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="brand">ROOT ACCESS // PORTAL</div>
        <a href="/" style="color:var(--text-muted); text-decoration:none; font-size:14px;">الرئيسية</a>
    </header>

    <div class="wrapper">
        <div class="portal-card">
            <h2 style="text-align:center; color:var(--neon-green); margin-top:0;">تسجيل الدخول إلى المنصة</h2>

            {% if error %}
            <div class="err-msg">✖ {{ error }}</div>
            {% endif %}

            <div class="tabs">
                <button type="button" class="tab-btn active" id="btn_student" onclick="switchRole('student')">🎓 دخول الطالب</button>
                <button type="button" class="tab-btn" id="btn_teacher" onclick="switchRole('teacher')">👨‍🏫 دخول المعلم</button>
            </div>

            <!-- نموذج دخول الطالب -->
            <div id="box_student" class="form-box active">
                <p style="color:var(--text-muted); font-size:13px; text-align:center; margin-top:0;">
                    ادخل إلى صفوفك ومهامك وشهاداتك عبر بريد Gmail ورمز PIN
                </p>
                <a href="/student-portal" style="text-decoration:none;">
                    <button type="button" class="btn-neon">الانتقال إلى بوابة الطالب والصفوف ⬅</button>
                </a>
            </div>

            <!-- نموذج دخول المعلم -->
            <div id="box_teacher" class="form-box">
                <form action="/login" method="POST">
                    <label>حساب Gmail الخاص بالمعلم:</label>
                    <input type="email" name="username" placeholder="teacher@gmail.com" required dir="ltr">
                    
                    <label>كلمة المرور:</label>
                    <input type="password" name="password" placeholder="••••••••" required dir="ltr">
                    
                    <button type="submit" class="btn-neon">دخول المعلم</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function switchRole(role) {
            document.getElementById("btn_student").classList.toggle("active", role === "student");
            document.getElementById("btn_teacher").classList.toggle("active", role === "teacher");
            document.getElementById("box_student").classList.toggle("active", role === "student");
            document.getElementById("box_teacher").classList.toggle("active", role === "teacher");
        }
        // تفعيل تبويب المعلم تلقائياً إذا عاد بخطأ تسجيل دخول
        if ("{{ active_tab }}" === "teacher") switchRole("teacher");
    </script>
</body>
</html>
