<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق من الشهادة - ROOT ACCESS LMS</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #050505; color: #f3f4f6; margin: 0; display: flex; flex-direction: column; min-height: 100vh; }
        header { background: #0d1117; padding: 15px 30px; border-bottom: 1px solid #00ff88; display: flex; justify-content: space-between; align-items: center; }
        .brand { font-size: 20px; font-weight: bold; color: #00ff88; letter-spacing: 1px; }
        .main-wrapper { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .verify-card { background: #0d1117; border: 1px solid #00ff88; border-radius: 12px; padding: 35px; width: 100%; max-width: 520px; box-shadow: 0 0 30px rgba(0, 255, 136, 0.1); text-align: center; }
        .input-group { display: flex; gap: 10px; margin: 20px 0; }
        input { flex: 1; padding: 12px; background: #050505; border: 1px solid #374151; border-radius: 8px; color: #00ff88; font-size: 16px; font-family: monospace; text-align: center; text-transform: uppercase; outline: none; }
        input:focus { border-color: #00ff88; }
        button { padding: 12px 24px; background: #00ff88; color: #050505; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .result-box { display: none; margin-top: 20px; padding: 20px; border-radius: 10px; text-align: right; }
        .result-valid { background: rgba(0, 255, 136, 0.1); border: 1px solid #00ff88; }
        .result-invalid { background: rgba(239, 68, 68, 0.12); border: 1px solid #ef4444; text-align: center; }
        .detail-row { display: flex; justify-content: space-between; padding: 8px 0; font-size: 14px; border-bottom: 1px dashed #1f2937; }
    </style>
</head>
<body>
    <header>
        <div class="brand">ROOT ACCESS // نظام التوثيق</div>
        <a href="/" style="color:#9ca3af; text-decoration:none; font-size:14px;">الرئيسية</a>
    </header>

    <div class="main-wrapper">
        <div class="verify-card">
            <h1 style="color:#00ff88; margin-top:0; font-size:24px;">🛡️ التحقق من موثوقية الشهادة</h1>
            <p style="color:#9ca3af; font-size:14px;">أدخل الرقم التسلسلي للشهادة للتحقق من صحتها في سجلات المنصة</p>
            <div class="input-group">
                <input type="text" id="serial_input" placeholder="RA-2026-XXXXXX" dir="ltr">
                <button type="button" onclick="verifyCertificate()">تحقق</button>
            </div>
            <div id="result_box" class="result-box"></div>
        </div>
    </div>

    <script>
        window.onload = function() {
            const serial = new URLSearchParams(window.location.search).get("serial");
            if (serial) { document.getElementById("serial_input").value = serial; verifyCertificate(); }
        };

        async function verifyCertificate() {
            const serial = document.getElementById("serial_input").value.trim().toUpperCase();
            const box = document.getElementById("result_box");
            if (!serial) return;
            box.style.display = "block";
            box.innerHTML = "<p style='text-align:center; color:#9ca3af;'>جاري الفحص...</p>";

            const res = await fetch(`/api/verify-certificate/${encodeURIComponent(serial)}`);
            const data = await res.json();

            if (res.ok && data.valid) {
                box.className = "result-box result-valid";
                box.innerHTML = `
                    <div style="color:#00ff88; font-size:18px; font-weight:bold; margin-bottom:12px;">✔ شهادة معتمدة وصحيحة</div>
                    <div class="detail-row"><span style="color:#9ca3af;">الرقم التسلسلي:</span><strong dir="ltr" style="color:#00ff88; font-family:monospace;">${data.cert_serial}</strong></div>
                    <div class="detail-row"><span style="color:#9ca3af;">الطالب:</span><strong>${data.student_id}</strong></div>
                    <div class="detail-row"><span style="color:#9ca3af;">الصف / المادة:</span><strong>${data.course_name}</strong></div>
                    <div class="detail-row"><span style="color:#9ca3af;">نوع الشهادة:</span><strong>${data.cert_type}</strong></div>
                    <div class="detail-row" style="border:none;"><span style="color:#9ca3af;">تاريخ الإصدار:</span><strong dir="ltr">${data.issue_date}</strong></div>
                `;
            } else {
                box.className = "result-box result-invalid";
                box.innerHTML = `<div style="color:#ef4444; font-weight:bold; font-size:17px;">✖ شهادة غير صالحة أو غير مسجلة</div>`;
            }
        }
    </script>
</body>
</html>
